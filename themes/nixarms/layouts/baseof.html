<!doctype html>
<html lang="{{ site.Language.Locale | default "en-gb" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ with resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{ end }}
{{ partial "analytics.html" . }}
</body>
</html>
