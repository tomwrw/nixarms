{{ define "main" }}
<section class="band on-dark">
  <div class="wrap page-band">
    <p class="eyebrow">Error 404</p>
    <h1>That one's off</h1>
    <p class="lede">The page you asked for isn't here. It may have moved, or the link was wrong.</p>
    <div class="band-actions">
      <a class="btn btn--brass" href="{{ "/" | relURL }}">Back to the bar</a>
      <a class="btn btn--ghost-light" href="{{ "/start/" | relURL }}">Start here</a>
    </div>
  </div>
</section>
<div class="wrap section section--last">
  <div class="section-head">
    <div>
      <h2>Or try one of these</h2>
    </div>
  </div>
  <div class="pills">
    {{- range site.Menus.main }}
    <a class="pill" href="{{ .URL }}">{{ .Name }}</a>
    {{- end }}
  </div>
</div>
{{ end }}
