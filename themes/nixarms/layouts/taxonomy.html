{{ define "main" }}
<section class="band on-dark">
  <div class="wrap page-band">
    <p class="eyebrow">The Regulars</p>
    <h1>Browse by tag</h1>
  </div>
</section>
<div class="wrap section section--last">
  <div class="pills">
    {{- range .Data.Terms.Alphabetical }}
    <a class="pill" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a>
    {{- end }}
  </div>
</div>
{{ end }}
