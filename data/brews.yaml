# "Which brew?" helper on /brewhouse/. Same shape as paths.yaml.
- id: first
  label: "Just installed NixOS"
  title: "Stick with the house pour."
  pitch: "The `configuration.nix` the installer made is all you need for now. Learn to add apps, rebuild and roll back first."
  points:
    - "Nothing new to learn beyond your config file"
    - "Every guide's examples still work for you"
    - "Moving to flakes later is a small step"
  cta: "Read about the house pour"
  url: "/brewhouse/vanilla/"

- id: pinned
  label: "I want it reproducible"
  title: "Bottle it with flakes."
  pitch: "Flakes pin the exact version of everything you use, so a rebuild next month, or on another PC, gives you the same system."
  points:
    - "A `flake.lock` records every ingredient"
    - "Easy to keep your config in git"
    - "Every config in The Regulars uses flakes"
  cta: "Read about flakes"
  url: "/brewhouse/flakes/"

- id: several
  label: "I have several machines"
  title: "Try flake-parts, then the dendritic pattern."
  pitch: "Once a desktop, laptop and server share settings, a single flake file gets crowded. flake-parts splits it up; the dendritic pattern organises it by feature."
  points:
    - "Share one gaming or desktop module across machines"
    - "Each machine says *what* it is, not how to build it"
    - "Worth the extra learning once you have three or more hosts"
  cta: "Read about the dendritic pattern"
  url: "/brewhouse/dendritic/"

- id: everything
  label: "NixOS, Mac and Home Manager"
  title: "Have a look at den."
  pitch: "If you're managing NixOS, a Mac with nix-darwin and Home Manager users from one place, den gives you a framework built for exactly that."
  points:
    - "One \"aspect\" can configure the system, the Mac and your user"
    - "Works with or without flakes"
    - "The newest and steepest option here, so try it in a test repo first"
  cta: "Read about den"
  url: "/brewhouse/den/"
