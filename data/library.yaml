# The Library. The first four appear on the homepage.
# level: On tap (use it all the time), First pint, Second round or Top shelf. Colours live in the level-badge partial.
# The Library page sorts cards by level (by-level partial); order within a level is the order here.
- name: "search.nixos.org"
  url: "https://search.nixos.org"
  short: "find any package or setting"
  level: "On tap"
  description: "Search every package and every NixOS option. You'll have this open more than anything else."
- name: "Zero to Nix"
  url: "https://zero-to-nix.com"
  short: "the concepts, gently"
  level: "First pint"
  description: "A friendly, well-designed introduction to what Nix is and why it works the way it does."
- name: "NixOS & Flakes Book"
  url: "https://nixos-and-flakes.thiscute.world"
  short: "the next step up"
  level: "Second round"
  description: "An unofficial, opinionated guide to running NixOS with flakes. Pairs well with ryan4yin/nix-config in The Regulars."
- name: "nix.dev"
  url: "https://nix.dev"
  short: "the official docs and tutorials"
  level: "Top shelf"
  description: "The official home for Nix documentation and tutorials, maintained by the community."
- name: "NixOS manual"
  url: "https://nixos.org/manual/nixos/stable/"
  short: "installation and configuration"
  level: "Top shelf"
  description: "The official manual: installing NixOS, configuration options, and upgrading between releases."
- name: "NixOS Wiki"
  url: "https://wiki.nixos.org"
  short: "community how-tos"
  level: "On tap"
  description: "Community-written pages for specific hardware, apps and fixes. Great for \"how do I get X working?\""
- name: "NixOS Discourse"
  url: "https://discourse.nixos.org"
  short: "ask questions"
  level: "On tap"
  description: "The official forum. Beginner questions are welcome. Search first, then ask."
