# The Menu: Nix jargon, translated. The first six appear on the homepage chalkboard.
- term: "Generation"
  meaning: "A save point for your whole system. You can boot into any of them."
- term: "Rebuild"
  meaning: "\"Apply my changes.\" You edit the file, then rebuild to make it real."
- term: "nixpkgs"
  meaning: "The cellar. Where every package lives, and the place you search for apps."
- term: "Flake"
  meaning: "A recipe with the exact version of every ingredient written on it. Same pint, every time."
- term: "Home Manager"
  meaning: "The same idea, for your own apps and dotfiles rather than the whole system."
- term: "Declarative"
  meaning: "Saying *what* you want, not the steps to get there. Like ordering, not brewing."
- term: "configuration.nix"
  meaning: "The main file that describes your machine. On a fresh install it lives in `/etc/nixos/`."
- term: "Channel"
  meaning: "Which barrel you're pouring from: a stable release (like 26.05) or unstable, which updates continuously."
- term: "Nix store"
  meaning: "The cellar floor, at `/nix/store`. Every package version sits in its own folder, so nothing overwrites anything else."
- term: "Derivation"
  meaning: "Nix's word for a build recipe: the exact inputs and steps that produce one package."
- term: "Overlay"
  meaning: "A way to swap or tweak packages in nixpkgs. Your own house brew on the same tap."
- term: "Module"
  meaning: "A chunk of configuration you can switch on with one line, like `programs.steam.enable = true;`."
- term: "nix-shell / nix shell"
  meaning: "A temporary room with extra tools in it. Leave the room and the tools are gone."
- term: "Garbage collection"
  meaning: "Clearing the empties: `nix-collect-garbage` removes old generations and packages nothing uses any more."
