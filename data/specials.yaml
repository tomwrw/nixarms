# "What's on tap" on the homepage: a chalkboard tap list of six things NixOS does well.
# Each special has a name, a line of text and `pour`: the one line of config or the command that does it.
# Check every `pour` still works on current NixOS (search.nixos.org) before publishing.
- title: "A desktop that's entirely yours"
  text: "Bars, themes, keybinds and wallpapers all live in your config, so your setup survives a reinstall."
  pour: "programs.niri.enable = true;"

- title: "A gaming rig in a dozen lines"
  text: "Steam, Proton, gamemode, MangoHud and a couch-ready gamescope session."
  pour: "programs.steam.enable = true;"

- title: "Same setup on every machine"
  text: "A desktop and a tablet built from one repo. Change a setting once and both pick it up."
  pour: "sudo nixos-rebuild switch --flake ."

- title: "A home server, one line per service"
  text: "A media server, photo backup and ad blocking for the whole house. Each one is a line of config."
  pour: "services.jellyfin.enable = true;"

- title: "Try any app without installing it"
  text: "Run it once, close the terminal and it's gone. The download waits in the Nix store until your next clear-out."
  pour: "nix-shell -p cowsay"

- title: "Experiments you can undo"
  text: "Try a new desktop tonight. Don't like it? Yesterday's system is one command away, or still in the boot menu."
  pour: "sudo nixos-rebuild switch --rollback"
