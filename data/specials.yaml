# "What's on tap" tiles on the homepage.
# Image and text only, no captions. Screenshots that aren't ours still need a reuse licence, and their credit goes in THIRD_PARTY.md and the README's Credits.
- title: "A desktop that's entirely yours"
  text: "Bars, themes, keybinds and wallpapers all live in your config, so your setup survives a reinstall."
  image: "tile-rice.jpg"
  alt: "Frost-Phoenix's NixOS desktop running Hyprland, with a system-info panel and ASCII art"
- title: "A gaming rig in a dozen lines"
  text: "Steam, Proton, gamemode, MangoHud and a couch-ready gamescope session."
  image: "tile-gaming.jpg"
  alt: "A gaming.nix file in an editor next to a terminal running nixos-rebuild switch"
- title: "Same setup on every machine"
  text: "A desktop and a tablet built from one repo. Change a setting once and both pick it up."
  image: "tile-machines.jpg"
  alt: "Diagram: one nix-config repo building two machines, a gaming desktop and a Surface tablet"
- title: "A home server, one line per service"
  text: "A media server, photo backup, ad blocking and a dashboard to watch it all. Each is a few lines of config."
  image: "tile-homeserver.jpg"
  alt: "A Homepage dashboard showing media, download and network services with live stats"
- title: "Try any app without installing it"
  text: "Run something once, close the terminal, and it's gone. No leftovers, no clutter."
  image: "tile-shell.jpg"
  alt: "Terminal: cowsay is missing, nix-shell -p cowsay makes it available, and after exit it is gone again"
- title: "Fearless experimenting"
  text: "Try a new desktop tonight. Don't like it? Yesterday's system is still in the boot menu."
  image: "tile-generations.jpg"
  alt: "Boot menu listing six NixOS generations, with yesterday's selected"
